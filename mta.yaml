_schema-version: "3.3"
ID: purchase-request-management2
version: 1.0.0
description: Purchase Request Management Backend

parameters:
  enable-parallel-deployments: true

modules:
  - name: purchase-request-management2-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: purchase-request-management2-db

  - name: purchase-request-management2-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: purchase-request-management2-db
      - name: purchase-request-management2-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

resources:
  - name: purchase-request-management2-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: purchase-request-management2-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
