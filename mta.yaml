_schema-version: "3.3"
ID: purchase-request-management
version: 1.0.0
description: Purchase Request Management System

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

modules:

    # ============================================================
  # STANDALONE APPRouter
  # ============================================================
  - name: purchase-request-management-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      disk-quota: 256M
      memory: 256M
      routes:
        - route: ${default-url}
      properties:
        TENANT_HOST_PATTERN: "^(.*)-purchase-request-management-approuter.cfapps.us10-001.hana.ondemand.com"
    requires:
      - name: purchase-request-management-auth
      - name: purchase-request-management-html5-repo-runtime
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
  # ============================================================
  # DB DEPLOYER
  # ============================================================
  - name: purchase-request-management-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: purchase-request-management-db

  # ============================================================
  # CAP SERVICE
  # ============================================================
  - name: purchase-request-management-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: purchase-request-management-db
      - name: purchase-request-management-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ============================================================
  # FIORI APP DEPLOYER
  # ============================================================
  - name: purchase-request-management-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: purchaserequestmanagementpurchase_request
          artifacts:
            - purchase_request.zip
          target-path: app/
    requires:
      - name: purchase-request-management-auth
      - name: srv-api
      - name: purchase-request-management-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  # ============================================================
  # UI5 APPLICATION
  # ============================================================
  - name: purchaserequestmanagementpurchase_request
    type: html5
    path: app/purchase_request
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  # ============================================================
  # DESTINATIONS
  # ============================================================
  - name: purchase-request-management-destinations
    type: com.sap.application.content
    requires:
      - name: purchase-request-management-auth
        parameters:
          service-key:
            name: purchase-request-management-auth-key

      - name: purchase-request-management-html5-repo-host
        parameters:
          service-key:
            name: purchase-request-management-html5-repo-host-key

      - name: srv-api

      - name: purchase-request-management-destination
        parameters:
          content-target: true

    build-parameters:
      no-source: true

    parameters:
      content:
        instance:
          existing_destinations_policy: update

          destinations:

            - Name: purchase-request-management-html5-repository
              ServiceInstanceName: purchase-request-management-html5-repo-host
              ServiceKeyName: purchase-request-management-html5-repo-host-key
              sap.cloud.service: purchaserequestmanagement.service

            - Name: purchase-request-management-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: purchase-request-management-auth
              ServiceKeyName: purchase-request-management-auth-key
              sap.cloud.service: purchaserequestmanagement.service


resources:

  # ============================================================
  # HANA HDI
  # ============================================================
  - name: purchase-request-management-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ============================================================
  # XSUAA
  # ============================================================
  - name: purchase-request-management-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: purchase-request-management-${org}-${space}
        tenant-mode: shared
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"

  # ============================================================
  # HTML5 REPOSITORY - APP HOST
  # ============================================================
  - name: purchase-request-management-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ============================================================
  # HTML5 REPOSITORY - APP RUNTIME
  # ============================================================
  - name: purchase-request-management-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # ============================================================
  # DESTINATION SERVICE
  # ============================================================
  - name: purchase-request-management-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api


# ==============================================================
# BUILD
# ==============================================================
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production